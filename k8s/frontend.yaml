apiVersion: apps/v1
kind: Deployment
metadata:
  name: proflow-ui
  namespace: proflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proflow-ui
  template:
    metadata:
      labels:
        app: proflow-ui
    spec:
      containers:
      - name: proflow-ui
        image: proflow/ui:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: proflow-ui-service
  namespace: proflow
spec:
  selector:
    app: proflow-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proflow-ingress
  namespace: proflow
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - app.proflow.dev
    secretName: proflow-tls
  rules:
  - host: app.proflow.dev
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: proflow-api-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proflow-ui-service
            port:
              number: 80
