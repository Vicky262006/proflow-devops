version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: proflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - proflow-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: proflow-redis
    restart: unless-stopped
    networks:
      - proflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proflow-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/proflow_enterprise
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=http://localhost
      - PORT=5000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - proflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - proflow-net

  prometheus:
    image: prom/prometheus:latest
    container_name: proflow-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - proflow-net

  grafana:
    image: grafana/grafana:latest
    container_name: proflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - proflow-net

volumes:
  mongo-data:

networks:
  proflow-net:
    driver: bridge
